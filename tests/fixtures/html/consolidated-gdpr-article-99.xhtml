<?xml version="1.0" encoding="UTF-8"?><html xmlns="http://www.w3.org/1999/xhtml"><body><div xmlns="http://www.w3.org/1999/xhtml" class="eli-subdivision" id="art_99">
               <p class="title-article-norm" id="id-f57099df-55db-4a53-aa5c-8e0d046fd0db">Article 99</p>
               <div class="eli-title" id="art_99.tit_1">
                  <p class="stitle-article-norm">Entry into force and application</p>
               </div>
               <div class="norm">
                  <span class="no-parag">1.  </span>
                  <div class="norm inline-element">This Regulation shall enter into force on the twentieth day following that of its publication in the <span class="italics">Official Journal of the European Union</span>.</div>
               </div>
               <div class="norm">
                  <span class="no-parag">2.  </span>
                  <div class="norm inline-element">It shall apply from 25 May 2018.</div>
               </div>
            </div>
         </body></html>
